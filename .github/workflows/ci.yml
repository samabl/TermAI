# TermAI CI - merge-blocking gates.
#
# Contract: docs/spec/07-engineering-quality-and-release.md.
# Admitted actions (ADR-0021): actions/checkout, actions/setup-node and
# actions/upload-artifact. The upload action is the only admitted action; any further action
# needs its own ADR. Enforced by K8, which also checks that artifact uploads pin a retention
# policy and stay inside the content whitelist.
#
# Two disjoint artifact scopes (both closed lists, enforced by review + K8):
#   - windows-build   -> build outputs only: the three binaries + SHA256SUMS.txt (ADR-0021 D2).
#   - design-baseline -> visual baselines + one provenance manifest (ADR-0022 D3). This job
#                        runs on workflow_dispatch only, so ordinary pushes upload nothing.
# Artifacts of a public repository are world-downloadable, so uploads never carry gate
# reports, session data, terminal content or absolute paths (AR-11 / section 6.3).
#
# Toolchain: Rust is pinned by rust-toolchain.toml and Node by package.json engines
# (>=22, because the design-gates CDP client needs a global WebSocket, which Node 20
# does not have - the first CI run died on "ReferenceError: WebSocket is not defined").
#
# PLATFORM MATRIX - the v1 gate architecture is Win x64 + Linux x64 + macOS arm64
# (ADR-0014 decision 2). Read this block before reading any green run as "P0 exit proven".
#
# windows-latest - the pre-existing runner and still the strongest one: Windows x64 is the
#   primary platform (DC-16 / ConPTY) and the committed visual baselines are win32-x64.
#
# ubuntu-latest (linux-x64) - ADDED HERE, FIRST INTRODUCTION. Runs the identical kernel gate
#   set K1-K8 plus the injection selftest, and the platform-independent Node gates (tokens,
#   design static layer, design browser layer). The clippy blocker that stopped this job is
#   gone: K2 was previously failing on the cfg(unix) forkpty path (unused mut/import, dead
#   code) and those warnings are now fixed in crates/termai-pty. STILL UNVERIFIED: K1/K2
#   were only ever checked cross-target from a Windows host
#   (cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu); K3
#   (cargo test) and the Node gates have never run on Linux, so the first CI run of this job
#   is the first real Linux signal. A red run here is a platform defect, not a flake.
#   Visual note: B4 compares against prototype/baseline/<platform>-<arch>-*.png, which are
#   win32-x64 only, so on this runner B4 SKIPs with the explicit "no baseline for linux-x64"
#   reason; if Chrome is absent the whole B layer SKIPs with "Chrome not found". Both are
#   printed and neither is a silent pass. No `|| true` is used anywhere.
#
# macos-latest (macos-arm64) - ADDED HERE, FIRST INTRODUCTION, NOT VERIFIED ON macOS.
#   macOS has NEVER been compiled anywhere before this job. Local evidence is a cross
#   `cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings`
#   from a Windows host, which type-checks clean - but that is check-only: it does not link,
#   it does not build blake3's native code and it runs no test. This job therefore exists to
#   produce the first macOS signal, and must not be described as "macOS passes" until a green
#   run exists. The job asserts the runner is arm64, because an Intel result would not
#   satisfy ADR-0014.
#
# NOT IN THIS FILE (and therefore still blocking P0 exit, HARNESS section 7): the ADR-0014
# gate machines RM-A / RM-B / RM-C and the gates that need them - L4 performance, L5 fuzz,
# L6 12-combination shell x font matrix, L7 visual on RM-C, L8 soak. Cloud runners are
# explicitly NON-GATING for every performance and compatibility number (ADR-0014 decision 1
# rule 5), so a green CI run never substitutes for a reference-machine result.
#
# jobs:
#   tokens        - design-token codegen is idempotent (no drift) + ruler/contrast/hex gates + validator selftest
#   rust          - crates/termai-tokens is formatted and compiles (generated leaf crate, no dependencies)
#   design        - tools/design-gates: static layer S1-S10 always, browser layer B1-B10
#                   (Chrome/Edge are both detected; the win32-x64 baselines match this runner)
#   design-baseline - regenerate prototype/baseline on this runner; workflow_dispatch ONLY
#                   (ADR-0022: a pixel baseline is an environment fingerprint)
#   kernel        - tools/kernel-gates: K1 fmt / K2 clippy / K3 test / K4 dep shape / K5 license /
#                   K6 spec-defects / K7 CODEOWNERS coverage / K8 artifacts, plus the injection selftest
#   linux-x64     - the same kernel gates on a native Linux x64 runner (ADR-0014), plus tokens and
#                   the design static layer; browser B4 SKIPs without a linux-x64 baseline
#   macos-arm64   - fmt / check / clippy / test on a native arm64 macOS runner (ADR-0014);
#                   first introduction; verified by GitHub Actions run 35890840865 (sha c221807)
#   windows-build - release build of the whole workspace (the artifact-producing job)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: tokens (codegen drift + ruler / contrast / hex gates)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate tokens and fail on artifact drift
        run: |
          node tools/tokens/build.mjs
          Write-Host '--- generated artifacts must be committed (DC-09 idempotency) ---'
          git diff --stat -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
          git diff --exit-code -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
      - name: tokens:check (schema / rulers / WCAG contrast / drift / hex debt)
        run: npm run tokens:check
      - name: tokens:selftest (validator rejects injected faults)
        run: npm run tokens:selftest

  rust:
    name: rust (crates/termai-tokens fmt + check)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version; cargo --version
      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/termai-tokens/Cargo.toml -- --check
      - name: cargo check
        run: cargo check --manifest-path crates/termai-tokens/Cargo.toml

  design:
    name: design (static S1-S10 always + browser B1-B10)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static layer: pure Node, no browser, runs on every runner/commit.
      # --strict is explicit (and a no-op): S8 hardcoded-hex debt is blocking by default,
      # AR-22 target = 0. The flag is kept so the intent is visible in the pipeline.
      - name: design:check static layer (S1-S10, spec 02 A17-A35 / G11-G17)
        run: npm run design:check:static -- --strict
      # Browser layer: the script already probes the Windows Chrome/Edge locations. Export
      # CHROME_PATH so the choice is explicit; if neither browser exists the layer SKIPs with
      # an explicit reason instead of passing silently.
      - name: Browser layer prerequisite (Chrome / Edge)
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            "CHROME_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "browser: $found"
          } else {
            Write-Host '::warning::no Chrome or Edge found; the browser layer will SKIP with an explicit reason'
          }
      - name: "design:check (full: static + browser, animation frozen)"
        run: npm run design:check
      - name: design:selftest (inject faults on temp copies; prove gates are not always-green)
        run: npm run design:selftest
      - name: Visual baseline note
        run: |
          Write-Host 'B4 compares against prototype/baseline/<platform>-<arch>-*.png.'
          Write-Host 'The committed baselines are win32-x64, which is what this runner reports,'
          Write-Host 'so B4 is expected to be a real comparison here rather than a SKIP.'

  # Visual-baseline generation (ADR-0022). This job runs ONLY on workflow_dispatch: the
  # committed baselines are produced here, on the same runner image and browser build that
  # the design job later verifies against. A pixel baseline is an environment fingerprint,
  # not a portable asset - the developer-machine baselines failed B4 with 0.044%-1.245%
  # against a <=0.1% gate, with the diff bbox over whole card regions (font rasterisation /
  # browser build / DPI). The artifact is downloaded by a human and committed through a PR;
  # this job never writes to main (AGENTS section 3 / spec 07 E4 double sign, ADR-0022 D6).
  design-baseline:
    name: design-baseline (workflow_dispatch only; publish prototype/baseline)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser prerequisite (Chrome / Edge) + version
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Error 'no Chrome or Edge found; a visual baseline cannot be generated here'
            exit 1
          }
          "CHROME_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vi = (Get-Item $found).VersionInfo
          "BROWSER_NAME=$($vi.FileName | Split-Path -Leaf)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BROWSER_VERSION=$($vi.ProductVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "browser: $found version $($vi.ProductVersion)"
      - name: Regenerate the visual baselines on this runner (ADR-0022 D1)
        run: npm run design:baseline
      - name: Write the baseline provenance manifest (ADR-0022 D3)
        run: |
          $png = Get-ChildItem prototype/baseline -Filter *.png -File |
            Where-Object { $_.Name -notlike '*.current.png' } | Sort-Object Name
          if (-not $png) { Write-Error 'design:baseline wrote no PNG'; exit 1 }
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0, 8))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rustc = 'unavailable'
          try { $rustc = (rustc --version) } catch { }
          $platformTag = (node -e "process.stdout.write(process.platform + '-' + process.arch)")
          $manifest = [ordered]@{
            schema               = 'termai-baseline-manifest/v1'
            adr                  = 'ADR-0022'
            generator            = 'ci.yml:design-baseline (workflow_dispatch only)'
            commit               = $env:GITHUB_SHA
            short_commit         = $env:GITHUB_SHA.Substring(0, 8)
            run_id               = $env:GITHUB_RUN_ID
            repository           = $env:GITHUB_REPOSITORY
            platform_tag         = $platformTag
            runner_os            = $env:RUNNER_OS
            runner_image         = $env:ImageOS
            runner_image_version = $env:ImageVersion
            node                 = (node --version)
            rustc                = $rustc
            browser_name         = $env:BROWSER_NAME
            browser_version      = $env:BROWSER_VERSION
            baseline_files       = @($png | ForEach-Object { $_.Name })
          }
          # ASCII output is deliberate: every value is ASCII and this avoids a UTF-8 BOM.
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path prototype/baseline/BASELINE-MANIFEST.json -Encoding ascii
          Get-Content prototype/baseline/BASELINE-MANIFEST.json
      - name: Upload the visual baselines + provenance manifest (ADR-0022 D3 scope only)
        uses: actions/upload-artifact@v4
        with:
          name: termai-visual-baseline-win32-x64-${{ env.SHORT_SHA }}
          # Closed scope: our own UI baseline PNGs (rendered from the committed prototype,
          # never from a live session) plus the provenance manifest. No reports, no logs,
          # no session data and no absolute paths (AR-11 / HARNESS section 6.3).
          path: |
            prototype/baseline/win32-x64-*.png
            !prototype/baseline/*.current.png
            prototype/baseline/BASELINE-MANIFEST.json
          retention-days: 14
          if-no-files-found: error

  kernel:
    name: kernel (K1-K8 fmt / clippy / test / dep-shape / license / defects / CODEOWNERS / artifacts)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The toolchain is pinned by rust-toolchain.toml, not by "stable": the first CI run
      # resolved stable to 1.98.0 and K2 failed on clippy lints that do not exist on the
      # 1.94.0 the M0 gates were verified against. rustup installs the pinned channel on
      # first use, so no third-party toolchain action is needed.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo --version
      # K3 runs the whole workspace test suite. On a host whose ConPTY cannot create a
      # console host, apps/termai/tests/e2e.rs fails with 0xC0000142 and zero bytes read;
      # that is a real platform defect being surfaced, not a flaky test, so it is reported
      # rather than skipped. crates/termai-pty/src/windows/conpty.rs carries the analysis.
      - name: kernel:check (K1-K8, merge-blocking)
        run: node tools/kernel-gates/check.mjs
      - name: kernel:selftest (inject faults; prove the gates are not always-green)
        run: node tools/kernel-gates/check.mjs --selftest
      # E-P0-3's "gates in CI" half. ADR-0014 decision 5: section 5 numbers are NON_GATING off an
      # RM-A/RM-C reference machine and a cloud runner may not stand in, so these steps gate the
      # STRUCTURAL half (HARNESS row parity, schema parity, methodology self-check) and report the
      # measurement half as INCONCLUSIVE. They are wired now so that a reference machine makes them
      # judge, rather than discovering at that point that nothing runs them. Both exit 0 in the
      # INCONCLUSIVE state by design: a non-gating result must not turn the build red.
      - name: bench:check (structural gates; section 5 numbers NON_GATING per ADR-0014)
        run: npm run bench:check
      # The kernel gates get a selftest in CI; the bench gates must too, or their non-always-green
      # property is only ever demonstrated on a developer's machine. This injects faults and proves
      # the judgement logic reports them (bench:selftest, 6 control + 21 fault branches).
      - name: bench:selftest (inject faults; prove the bench gates can fail)
        run: npm run bench:selftest
      # G1's gating lane. The upstream esctest adapter lives in conformance:upstream and needs the
      # pinned checkout, so it is deliberately not wired here; this runs the L0 corpus only, which
      # reports G1: NOT_JUDGED until a real-corpus oracle is available.
      - name: conformance L0 (G1 corpus, gating lane)
        run: npm run conformance
      # The last of the four CI gates to be asked whether it can fail. It injects a corrupted
      # expectation into a regenerable case, asserts the runner reports it, restores, and requires the
      # restored corpus to run clean - so neither a broken runner nor a self-test that cannot fail.
      - name: conformance selftest (corrupt one expectation; prove the runner reports it)
        run: node tools/conformance/selftest.mjs
      # The generator/corpus drift check caught a real divergence in round 256 (debt-p0 A18: the generator
      # table said ESC #8 while the committed .trec said ESC #9) but no CI step ran it until now. It is
      # registered in K8's GATE_PAIRS, so it must be paired with the selftest below.
      - name: conformance verify
        run: npm run conformance:verify
      # Prove the drift check can fail: inject the historical ESC #9 -> ESC #8 drift into a regenerable
      # case, assert the check names it, restore in a finally block, then require the control to pass.
      - name: conformance verify selftest
        run: npm run conformance:verify:selftest

      - name: conformance suites (static capability declarations)
        run: npm run conformance:suites

      - name: conformance suites selftest (prove the declaration checks can fail)
        run: npm run conformance:suites:selftest
      # ADR-0014 decision 6 / spec 06 A-PM-12: the cost manifest must be complete and the month under
      # the cap. The structural part of this check gates (schema, arithmetic), and it fails only when
      # the cap is actually reached - a reading under the cap must not turn the build red.
      - name: ci-cost check (manifest schema + monthly cap per A-PM-12)
        run: node tools/ci-cost/check.mjs
      - name: ci-cost selftest (inject a bad total and a cap breach; prove both are caught)
        run: node tools/ci-cost/check.mjs --selftest
      # A gate with no judgement in its answer: the rule count and every stated copy of it either agree or
      # they do not. It carries a selftest, so K8's pairing rule is satisfied by construction.
      - name: audit-claims check (stated rule counts match section 6.3)
        run: node tools/audit/check-claims.mjs
      - name: audit-claims selftest (a differing count must be reported)
        run: node tools/audit/check-claims.mjs --selftest
      # ADR-0031 condition 4: an expired waiver is a failure, not a warning, so the register is
      # gated here and paired with its selftest below (registered in K8's GATE_PAIRS).
      - name: waivers check
        run: node tools/audit/check-waivers.mjs
      - name: waivers selftest
        run: node tools/audit/check-waivers.mjs --selftest

  # ADR-0014 decision 2: Linux x64 is a first-class gate platform, so it gets a native
  # runner instead of a cross-check issued from Windows. See the platform-matrix block at the
  # top of this file for the exact verified / unverified split. Nothing here is allowed to
  # pass silently: a missing browser or a missing linux-x64 baseline produces an explicit
  # SKIP line with a reason.
  linux-x64:
    name: linux x64 (kernel K1-K8 + tokens + design static; browser B4 SKIPs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # rust-toolchain.toml pins 1.94.0 with rustfmt + clippy; rustup installs it on first
      # use, so no third-party toolchain action is needed (ADR-0021 admits none).
      # x86_64-unknown-linux-gnu is this runner's host triple, so no cross target is required
      # and rust-toolchain.toml deliberately carries no "targets" entry for this job.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustc -vV
          cargo --version
      - name: kernel:check (K1-K8, merge-blocking)
        run: node tools/kernel-gates/check.mjs
      - name: kernel:selftest (inject faults; prove the gates are not always-green)
        run: node tools/kernel-gates/check.mjs --selftest
      # E-P0-3's "gates in CI" half. ADR-0014 decision 5: section 5 numbers are NON_GATING off an
      # RM-A/RM-C reference machine and a cloud runner may not stand in, so these steps gate the
      # STRUCTURAL half (HARNESS row parity, schema parity, methodology self-check) and report the
      # measurement half as INCONCLUSIVE. They are wired now so that a reference machine makes them
      # judge, rather than discovering at that point that nothing runs them. Both exit 0 in the
      # INCONCLUSIVE state by design: a non-gating result must not turn the build red.
      - name: bench:check (structural gates; section 5 numbers NON_GATING per ADR-0014)
        run: npm run bench:check
      # The kernel gates get a selftest in CI; the bench gates must too, or their non-always-green
      # property is only ever demonstrated on a developer's machine. This injects faults and proves
      # the judgement logic reports them (bench:selftest, 6 control + 21 fault branches).
      - name: bench:selftest (inject faults; prove the bench gates can fail)
        run: npm run bench:selftest
      # G1's gating lane. The upstream esctest adapter lives in conformance:upstream and needs the
      # pinned checkout, so it is deliberately not wired here; this runs the L0 corpus only, which
      # reports G1: NOT_JUDGED until a real-corpus oracle is available.
      - name: conformance L0 (G1 corpus, gating lane)
        run: npm run conformance
      # The last of the four CI gates to be asked whether it can fail. It injects a corrupted
      # expectation into a regenerable case, asserts the runner reports it, restores, and requires the
      # restored corpus to run clean - so neither a broken runner nor a self-test that cannot fail.
      - name: conformance selftest (corrupt one expectation; prove the runner reports it)
        run: node tools/conformance/selftest.mjs
      # The generator/corpus drift check caught a real divergence in round 256 (debt-p0 A18: the generator
      # table said ESC #8 while the committed .trec said ESC #9) but no CI step ran it until now. It is
      # registered in K8's GATE_PAIRS, so it must be paired with the selftest below.
      - name: conformance verify
        run: npm run conformance:verify
      # Prove the drift check can fail: inject the historical ESC #9 -> ESC #8 drift into a regenerable
      # case, assert the check names it, restore in a finally block, then require the control to pass.
      - name: conformance verify selftest
        run: npm run conformance:verify:selftest

      - name: conformance suites (static capability declarations)
        run: npm run conformance:suites

      - name: conformance suites selftest (prove the declaration checks can fail)
        run: npm run conformance:suites:selftest
      # ADR-0014 decision 6 / spec 06 A-PM-12: the cost manifest must be complete and the month under
      # the cap. The structural part of this check gates (schema, arithmetic), and it fails only when
      # the cap is actually reached - a reading under the cap must not turn the build red.
      - name: ci-cost check (manifest schema + monthly cap per A-PM-12)
        run: node tools/ci-cost/check.mjs
      - name: ci-cost selftest (inject a bad total and a cap breach; prove both are caught)
        run: node tools/ci-cost/check.mjs --selftest
      # A gate with no judgement in its answer: the rule count and every stated copy of it either agree or
      # they do not. It carries a selftest, so K8's pairing rule is satisfied by construction.
      - name: audit-claims check (stated rule counts match section 6.3)
        run: node tools/audit/check-claims.mjs
      - name: audit-claims selftest (a differing count must be reported)
        run: node tools/audit/check-claims.mjs --selftest
      # ADR-0031 condition 4: an expired waiver is a failure, not a warning, so the register is
      # gated here and paired with its selftest below (registered in K8's GATE_PAIRS).
      - name: waivers check
        run: node tools/audit/check-waivers.mjs
      - name: waivers selftest
        run: node tools/audit/check-waivers.mjs --selftest
      - name: Regenerate tokens and fail on artifact drift
        run: |
          node tools/tokens/build.mjs
          git diff --stat -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
          git diff --exit-code -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
      - name: tokens:check (schema / rulers / WCAG contrast / drift / hex debt)
        run: npm run tokens:check
      - name: tokens:selftest (validator rejects injected faults)
        run: npm run tokens:selftest
      # The static layer is pure Node and runs in any environment (check-design.mjs header);
      # --strict is explicit even though it is a no-op, same as the Windows design job.
      - name: design:check static layer (S1-S10, no browser)
        run: npm run design:check:static -- --strict
      # The browser layer runs wherever Chrome is present (browser.mjs probes the standard
      # Linux locations). B4 has no linux-x64 baseline and SKIPs with its own printed reason;
      # with no Chrome at all the whole B layer SKIPs with "Chrome not found". A real B-layer
      # FAIL must still block, so this step has no "|| true" and no continue-on-error.
      - name: "design:check (full: static + browser, animation frozen)"
        run: npm run design:check

  # ADR-0014 decision 2: macOS arm64 is a first-class gate platform. This job is the first
  # time the workspace is ever compiled on macOS, so it is labelled UNVERIFIED and must stay
  # labelled that way until a green run exists. See the platform-matrix block at the top.
  macos-arm64:
    name: "macos arm64 (fmt + check + clippy + test) [verified: run 35890840865]"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ADR-0014 makes macOS *arm64* the gate; an Intel image would produce a result that
      # cannot be cited for the arm64 gate, so refuse it loudly instead of reporting green.
      - name: Assert the runner is arm64 (ADR-0014)
        run: |
          uname -s
          uname -m
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::ADR-0014 makes macOS arm64 the v1 gate; this runner reports $(uname -m)"
            exit 1
          fi
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustc -vV
          cargo --version
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace

  windows-build:
    name: windows build (release workspace artifacts)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain and target
        run: |
          rustc --version
          cargo --version
          rustc -vV
      - name: cargo build --workspace --release
        run: cargo build --workspace --release --locked
      - name: Write SHA-256 checksums and export the short SHA
        run: |
          $exe = Get-ChildItem target/release -Filter *.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.BaseName -in @('termai','sessiond','pty_echo') }
          if (-not $exe) { Write-Error 'no workspace executable was produced'; exit 1 }
          foreach ($e in $exe) {
            '{0,-14} {1,10:N0} bytes  {2}' -f $e.BaseName, $e.Length, $e.FullName
          }
          $lines = foreach ($f in $exe) {
            '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content -Path target/release/SHA256SUMS.txt -Encoding ascii
          '--- SHA256SUMS.txt ---'
          Get-Content target/release/SHA256SUMS.txt
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0,8))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload build artifacts (ADR-0021 D2 whitelist only)
        uses: actions/upload-artifact@v4
        with:
          name: termai-0.1.0-win32-x64-${{ env.SHORT_SHA }}
          # Whitelist: build outputs only. Never add logs, gate reports, session data or
          # anything carrying absolute paths - artifacts of a public repository are
          # downloadable by anyone (AR-11 / HARNESS section 6.3: paths and command output
          # are L2 sensitive).
          path: |
            target/release/termai.exe
            target/release/sessiond.exe
            target/release/pty_echo.exe
            target/release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
