# TermAI CI - merge-blocking gates.
#
# Contract: docs/spec/07-engineering-quality-and-release.md.
# Admitted actions (ADR-0021): actions/checkout, actions/setup-node and
# actions/upload-artifact. The upload action is the only admitted action; any further action
# needs its own ADR. Enforced by K8, which also checks that artifact uploads pin a retention
# policy and stay inside the content whitelist.
#
# Two disjoint artifact scopes (both closed lists, enforced by review + K8):
#   - windows-build   -> build outputs only: the three binaries + SHA256SUMS.txt (ADR-0021 D2).
#   - design-baseline -> visual baselines + one provenance manifest (ADR-0022 D3). This job
#                        runs on workflow_dispatch only, so ordinary pushes upload nothing.
# Artifacts of a public repository are world-downloadable, so uploads never carry gate
# reports, session data, terminal content or absolute paths (AR-11 / section 6.3).
#
# Toolchain: Rust is pinned by rust-toolchain.toml and Node by package.json engines
# (>=22, because the design-gates CDP client needs a global WebSocket, which Node 20
# does not have - the first CI run died on "ReferenceError: WebSocket is not defined").
#
# SCOPE (deliberate and temporary): every job runs on windows-latest.
# Reasons: Windows x64 is the primary platform (DC-16 / ConPTY), and the visual baselines
# committed in prototype/baseline are win32-x64, so the design gates are strongest here.
#
# DEVIATION TO TRACK - read before trusting this pipeline as "P0 green":
# ADR-0014 makes Win x64 + Linux x64 + macOS arm64 the v1 gate architecture, so a
# Windows-only pipeline does NOT satisfy the v1 platform gate. HARNESS section 7 still
# requires the other two before P0 exit. Restoring them needs no new code:
#   - The workspace already cross-checks clean for Linux:
#       cargo check --workspace --all-targets --target x86_64-unknown-linux-gnu  -> exit 0
#   - BUT K2 (clippy -D warnings) would FAIL on Linux today: the cfg(unix) forkpty path
#     and the Windows-only test helpers emit warnings (unused variable/import, a struct
#     that is never constructed). Clean those before adding the Linux job.
#   - macOS arm64 has never been compiled anywhere yet.
#
# jobs:
#   tokens        - design-token codegen is idempotent (no drift) + ruler/contrast/hex gates + validator selftest
#   rust          - crates/termai-tokens is formatted and compiles (generated leaf crate, no dependencies)
#   design        - tools/design-gates: static layer S1-S10 always, browser layer B1-B10
#                   (Chrome/Edge are both detected; the win32-x64 baselines match this runner)
#   design-baseline - regenerate prototype/baseline on this runner; workflow_dispatch ONLY
#                   (ADR-0022: a pixel baseline is an environment fingerprint)
#   kernel        - tools/kernel-gates: K1 fmt / K2 clippy / K3 test / K4 dep shape / K5 license /
#                   K6 spec-defects / K7 CODEOWNERS coverage, plus the injection selftest
#   windows-build - release build of the whole workspace (the artifact-producing job)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: tokens (codegen drift + ruler / contrast / hex gates)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate tokens and fail on artifact drift
        run: |
          node tools/tokens/build.mjs
          Write-Host '--- generated artifacts must be committed (DC-09 idempotency) ---'
          git diff --stat -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
          git diff --exit-code -- packages/tokens crates/termai-tokens prototype/termai-ui-terminal-first.html
      - name: tokens:check (schema / rulers / WCAG contrast / drift / hex debt)
        run: npm run tokens:check
      - name: tokens:selftest (validator rejects injected faults)
        run: npm run tokens:selftest

  rust:
    name: rust (crates/termai-tokens fmt + check)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version; cargo --version
      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/termai-tokens/Cargo.toml -- --check
      - name: cargo check
        run: cargo check --manifest-path crates/termai-tokens/Cargo.toml

  design:
    name: design (static S1-S10 always + browser B1-B10)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static layer: pure Node, no browser, runs on every runner/commit.
      # --strict is explicit (and a no-op): S8 hardcoded-hex debt is blocking by default,
      # AR-22 target = 0. The flag is kept so the intent is visible in the pipeline.
      - name: design:check static layer (S1-S10, spec 02 A17-A35 / G11-G17)
        run: npm run design:check:static -- --strict
      # Browser layer: the script already probes the Windows Chrome/Edge locations. Export
      # CHROME_PATH so the choice is explicit; if neither browser exists the layer SKIPs with
      # an explicit reason instead of passing silently.
      - name: Browser layer prerequisite (Chrome / Edge)
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            "CHROME_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "browser: $found"
          } else {
            Write-Host '::warning::no Chrome or Edge found; the browser layer will SKIP with an explicit reason'
          }
      - name: "design:check (full: static + browser, animation frozen)"
        run: npm run design:check
      - name: design:selftest (inject faults on temp copies; prove gates are not always-green)
        run: npm run design:selftest
      - name: Visual baseline note
        run: |
          Write-Host 'B4 compares against prototype/baseline/<platform>-<arch>-*.png.'
          Write-Host 'The committed baselines are win32-x64, which is what this runner reports,'
          Write-Host 'so B4 is expected to be a real comparison here rather than a SKIP.'

  # Visual-baseline generation (ADR-0022). This job runs ONLY on workflow_dispatch: the
  # committed baselines are produced here, on the same runner image and browser build that
  # the design job later verifies against. A pixel baseline is an environment fingerprint,
  # not a portable asset - the developer-machine baselines failed B4 with 0.044%-1.245%
  # against a <=0.1% gate, with the diff bbox over whole card regions (font rasterisation /
  # browser build / DPI). The artifact is downloaded by a human and committed through a PR;
  # this job never writes to main (AGENTS section 3 / spec 07 E4 double sign, ADR-0022 D6).
  design-baseline:
    name: design-baseline (workflow_dispatch only; publish prototype/baseline)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser prerequisite (Chrome / Edge) + version
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Error 'no Chrome or Edge found; a visual baseline cannot be generated here'
            exit 1
          }
          "CHROME_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $vi = (Get-Item $found).VersionInfo
          "BROWSER_NAME=$($vi.FileName | Split-Path -Leaf)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BROWSER_VERSION=$($vi.ProductVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "browser: $found version $($vi.ProductVersion)"
      - name: Regenerate the visual baselines on this runner (ADR-0022 D1)
        run: npm run design:baseline
      - name: Write the baseline provenance manifest (ADR-0022 D3)
        run: |
          $png = Get-ChildItem prototype/baseline -Filter *.png -File |
            Where-Object { $_.Name -notlike '*.current.png' } | Sort-Object Name
          if (-not $png) { Write-Error 'design:baseline wrote no PNG'; exit 1 }
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0, 8))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rustc = 'unavailable'
          try { $rustc = (rustc --version) } catch { }
          $platformTag = (node -e "process.stdout.write(process.platform + '-' + process.arch)")
          $manifest = [ordered]@{
            schema               = 'termai-baseline-manifest/v1'
            adr                  = 'ADR-0022'
            generator            = 'ci.yml:design-baseline (workflow_dispatch only)'
            commit               = $env:GITHUB_SHA
            short_commit         = $env:GITHUB_SHA.Substring(0, 8)
            run_id               = $env:GITHUB_RUN_ID
            repository           = $env:GITHUB_REPOSITORY
            platform_tag         = $platformTag
            runner_os            = $env:RUNNER_OS
            runner_image         = $env:ImageOS
            runner_image_version = $env:ImageVersion
            node                 = (node --version)
            rustc                = $rustc
            browser_name         = $env:BROWSER_NAME
            browser_version      = $env:BROWSER_VERSION
            baseline_files       = @($png | ForEach-Object { $_.Name })
          }
          # ASCII output is deliberate: every value is ASCII and this avoids a UTF-8 BOM.
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path prototype/baseline/BASELINE-MANIFEST.json -Encoding ascii
          Get-Content prototype/baseline/BASELINE-MANIFEST.json
      - name: Upload the visual baselines + provenance manifest (ADR-0022 D3 scope only)
        uses: actions/upload-artifact@v4
        with:
          name: termai-visual-baseline-win32-x64-${{ env.SHORT_SHA }}
          # Closed scope: our own UI baseline PNGs (rendered from the committed prototype,
          # never from a live session) plus the provenance manifest. No reports, no logs,
          # no session data and no absolute paths (AR-11 / HARNESS section 6.3).
          path: |
            prototype/baseline/win32-x64-*.png
            !prototype/baseline/*.current.png
            prototype/baseline/BASELINE-MANIFEST.json
          retention-days: 14
          if-no-files-found: error

  kernel:
    name: kernel (K1-K7 fmt / clippy / test / dep-shape / license / defects / CODEOWNERS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The toolchain is pinned by rust-toolchain.toml, not by "stable": the first CI run
      # resolved stable to 1.98.0 and K2 failed on clippy lints that do not exist on the
      # 1.94.0 the M0 gates were verified against. rustup installs the pinned channel on
      # first use, so no third-party toolchain action is needed.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo --version
      # K3 runs the whole workspace test suite. On a host whose ConPTY cannot create a
      # console host, apps/termai/tests/e2e.rs fails with 0xC0000142 and zero bytes read;
      # that is a real platform defect being surfaced, not a flaky test, so it is reported
      # rather than skipped. crates/termai-pty/src/windows/conpty.rs carries the analysis.
      - name: kernel:check (K1-K7, merge-blocking)
        run: node tools/kernel-gates/check.mjs
      - name: kernel:selftest (inject faults; prove the gates are not always-green)
        run: node tools/kernel-gates/check.mjs --selftest

  windows-build:
    name: windows build (release workspace artifacts)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain and target
        run: |
          rustc --version
          cargo --version
          rustc -vV
      - name: cargo build --workspace --release
        run: cargo build --workspace --release --locked
      - name: Write SHA-256 checksums and export the short SHA
        run: |
          $exe = Get-ChildItem target/release -Filter *.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.BaseName -in @('termai','sessiond','pty_echo') }
          if (-not $exe) { Write-Error 'no workspace executable was produced'; exit 1 }
          foreach ($e in $exe) {
            '{0,-14} {1,10:N0} bytes  {2}' -f $e.BaseName, $e.Length, $e.FullName
          }
          $lines = foreach ($f in $exe) {
            '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content -Path target/release/SHA256SUMS.txt -Encoding ascii
          '--- SHA256SUMS.txt ---'
          Get-Content target/release/SHA256SUMS.txt
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0,8))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload build artifacts (ADR-0021 D2 whitelist only)
        uses: actions/upload-artifact@v4
        with:
          name: termai-0.1.0-win32-x64-${{ env.SHORT_SHA }}
          # Whitelist: build outputs only. Never add logs, gate reports, session data or
          # anything carrying absolute paths - artifacts of a public repository are
          # downloadable by anyone (AR-11 / HARNESS section 6.3: paths and command output
          # are L2 sensitive).
          path: |
            target/release/termai.exe
            target/release/sessiond.exe
            target/release/pty_echo.exe
            target/release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
