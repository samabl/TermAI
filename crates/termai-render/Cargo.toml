[package]
name = "termai-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TermAI render pipeline (kernel/03). UI-side grid mirror (ADR-0024 D1) plus the S6 shaping and S7 atlas slices (ADR-0027 D1)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
termai-core = { workspace = true }
# ADR-0027 D1 (Accepted): rustybuzz 0.20.1 (MIT), swash 0.2.10 (Apache-2.0 OR MIT) and
# fontdb 0.24.0 (MIT) are admitted at SPDX tier A with R=D=0; the unmaintained advisories
# against rustybuzz/ttf-parser are covered by the ADR-0031 time-boxed waiver W-01
# (docs/audit/waivers.json, expires 2027-03-23 or after 2 minors). kernel/03 K-05: rustybuzz
# is the only OpenType shaping engine, swash the only outline/colour-glyph engine; fontdb
# carries font discovery and the fallback chain (kernel/03 section 3.5.2).
# No wgpu, winit, termai-gpu or termai-vt dependency in this slice: the K4 edge table stays
# termai-render -> [termai-core] (ADR-0024 D1, ADR-0027 D2/D3 - no fake dependency).
rustybuzz = { workspace = true }
swash = { workspace = true }
fontdb = { workspace = true }

[dev-dependencies]
# The K-04 column-width port (shape.rs `CellWidthSource`) has no width table of its own. Its
# production binding is termai-vt's width API; registering the termai-render -> termai-vt
# edge is a separate admission step (ADR-0027 D2), so until then the tests bind the port to
# the same upstream table termai-vt uses internally (crates/termai-vt/src/grid.rs uses
# unicode_width). That is the identical crate, not a second width table.
unicode-width = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
