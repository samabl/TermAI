# deny.toml - TermAI supply-chain policy (ADR-0015 link-boundary + ADR-0027 dependency admission)
# Run: cargo deny check licenses advisories bans sources

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# ADR-0015 allow-list: permissive licences plus the weak-copyleft ones it admits under conditions.
# GPL / AGPL / SSPL are deliberately absent: they must never enter the core link boundary (AR-21).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# workspace inheritance ({ workspace = true }) is this repository's own style, not a wildcard version
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
