[package]
name = "termai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "termai CLI: PTY launch, logdump, grid digest, and the protocol probes used to confirm a change reached the measured binary (kernel/02)."

[[bin]]
name = "termai"
path = "src/main.rs"

[dependencies]
termai-core = { workspace = true }
termai-ipc = { workspace = true }
termai-vt = { workspace = true }
termai-pty = { workspace = true }
termai-session = { workspace = true }
