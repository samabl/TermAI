[package]
name = "sessiond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "TermAI session daemon: session state machine, append-only Session Log, TAIL_REPLAY transport, stdin lease, IPC broker (kernel/04, ADR-0026)."

[lib]
name = "sessiond"
path = "src/lib.rs"

[[bin]]
name = "sessiond"
path = "src/main.rs"

[dependencies]
termai-core = { workspace = true }
termai-ipc = { workspace = true }
termai-vt = { workspace = true }
termai-pty = { workspace = true }
termai-session = { workspace = true }
blake3 = { workspace = true }
